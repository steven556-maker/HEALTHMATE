name: Deploy HealthMate to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # القيم دي بتتقرأ وقت البناء بس (Vite بيحقنها في الـ bundle). المفتاح العام (publishable/anon) مش سرّي فعليًا،
    # فبنقبله كـ secret أو كـ variable. لو حطّيتهم كـ Environment secrets في "github-pages" الـ job ده مش هيشوفهم
    # (الـ job ده من غير environment) — استخدم Repository secrets/variables.
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
      VITE_ASSISTANT_URL: ${{ vars.VITE_ASSISTANT_URL || secrets.VITE_ASSISTANT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check build-time configuration (fails if Supabase values are missing/invalid)
        run: node scripts/check-build-env.mjs --production
      - name: Build GitHub Pages app
        run: npm run build
      - name: Verify configuration was inlined into the bundle
        run: node scripts/check-build-env.mjs --production --dist dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  deploy-worker:
    if: ${{ vars.DEPLOY_WORKER == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate and materialize Worker config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # preview.yml بيقرا الـ account id من secrets، والـ README بيقول variable: بنقبل الاتنين.
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          RATE_KV_NAMESPACE_ID: ${{ vars.RATE_KV_NAMESPACE_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::Missing CLOUDFLARE_API_TOKEN secret'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo '::error::Missing CLOUDFLARE_ACCOUNT_ID (variable or secret)'; exit 1; }
          test -n "$RATE_KV_NAMESPACE_ID" || { echo '::error::Missing RATE_KV_NAMESPACE_ID variable'; exit 1; }
          test -n "$GEMINI_API_KEY" || { echo '::error::Missing GEMINI_API_KEY secret'; exit 1; }
          test -n "$SUPABASE_URL" || { echo '::error::Missing VITE_SUPABASE_URL secret'; exit 1; }
          test -n "$SUPABASE_ANON_KEY" || { echo '::error::Missing VITE_SUPABASE_ANON_KEY secret'; exit 1; }
          VITE_SUPABASE_URL="$SUPABASE_URL" VITE_SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" node scripts/check-build-env.mjs
          node --input-type=module -e 'import fs from "node:fs"; const p="worker/wrangler.toml"; const id=process.env.RATE_KV_NAMESPACE_ID; if (!/^[a-f0-9]{32}$/i.test(id)) throw Error("RATE_KV_NAMESPACE_ID must be a 32-character KV namespace id"); fs.writeFileSync(p, fs.readFileSync(p,"utf8").replace("__RATE_KV_NAMESPACE_ID__", id));'
      # النشر الأول: الأمر `wrangler deploy` بينشئ الـ Worker. بنحط الأسرار بعده (مش قبله) لأن `secret put` على Worker
      # لسه مش موجود في CI غير تفاعلي ممكن يفشل أو يسأل سؤال. الأسرار بتتحفظ بين عمليات النشر.
      - name: Deploy assistant Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config worker/wrangler.toml 2>&1 | tee "$RUNNER_TEMP/deploy.log"
      - name: Set Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          printf '%s' "$GEMINI_API_KEY" | npx wrangler secret put GEMINI_API_KEY --config worker/wrangler.toml
          if [ -n "$GROQ_API_KEY" ]; then printf '%s' "$GROQ_API_KEY" | npx wrangler secret put GROQ_API_KEY --config worker/wrangler.toml; fi
          printf '%s' "$SUPABASE_URL" | npx wrangler secret put SUPABASE_URL --config worker/wrangler.toml
          printf '%s' "$SUPABASE_ANON_KEY" | npx wrangler secret put SUPABASE_ANON_KEY --config worker/wrangler.toml
      # اختبار دخان: بيتأكد إن الـ Worker شغّال وإن الإعدادات المطلوبة موجودة (قيم true/false بس، مفيش أسرار).
      - name: Smoke test Worker (/api/health)
        run: |
          URL=$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -1)
          test -n "$URL" || { echo '::error::Could not find the workers.dev URL in the deploy output (is workers_dev disabled?)'; exit 1; }
          ORIGIN=$(grep -E '^ALLOWED_ORIGIN' worker/wrangler.toml | sed -E 's/^[^"]*"([^",]+).*/\1/')
          echo "::notice title=Worker URL::Set the Actions variable VITE_ASSISTANT_URL to $URL, then re-run the Pages build."
          sleep 5
          curl -fsS -H "Origin: $ORIGIN" "$URL/api/health" | tee "$RUNNER_TEMP/health.json"; echo
          node -e 'const c=JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP+"/health.json","utf8")).configured; const bad=["kv","supabase","gemini"].filter(k=>!c[k]); if(bad.length){console.log("::error::Worker is missing: "+bad.join(", ")); process.exit(1)}'
